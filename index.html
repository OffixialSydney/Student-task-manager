<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Task Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Top bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-lg font-bold text-indigo-600 flex items-center gap-2">
        <span>📚</span> Student Task Manager
      </h1>
      <button id="addTaskTopBtn" class="hidden sm:inline-flex bg-indigo-600 text-white text-sm font-medium px-3 py-2 rounded-lg hover:bg-indigo-700">
        + Add Task
      </button>
    </div>
  </header>

  <!-- Main content -->
  <main class="max-w-5xl mx-auto px-4 pb-24 pt-4">

    <!-- DASHBOARD VIEW -->
    <section id="view-dashboard" class="view">
      <h2 class="text-xl font-semibold mb-4">Dashboard</h2>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
          <p class="text-xs text-slate-500">Total Tasks</p>
          <p id="stat-total" class="text-2xl font-bold">0</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
          <p class="text-xs text-slate-500">Completed</p>
          <p id="stat-completed" class="text-2xl font-bold text-emerald-600">0</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
          <p class="text-xs text-slate-500">Pending</p>
          <p id="stat-pending" class="text-2xl font-bold text-amber-600">0</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
          <p class="text-xs text-slate-500">Overdue</p>
          <p id="stat-overdue" class="text-2xl font-bold text-rose-600">0</p>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6">
        <div class="flex items-center justify-between mb-2">
          <p class="text-sm font-medium">Overall Progress</p>
          <p id="progress-label" class="text-sm text-slate-500">0%</p>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-3">
          <div id="progress-bar" class="bg-indigo-600 h-3 rounded-full transition-all" style="width:0%"></div>
        </div>
      </div>

      <div>
        <h3 class="text-sm font-semibold text-slate-600 mb-2">Recent Tasks</h3>
        <div id="recent-tasks" class="space-y-2"></div>
      </div>
    </section>

    <!-- TASKS VIEW -->
    <section id="view-tasks" class="view hidden">
      <h2 class="text-xl font-semibold mb-4">All Tasks</h2>

      <!-- Search & Filters -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 mb-4 space-y-2">
        <input id="search-input" type="text" placeholder="Search tasks..."
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <div class="grid grid-cols-3 gap-2">
          <select id="filter-status" class="border border-slate-300 rounded-lg px-2 py-2 text-xs">
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
            <option value="overdue">Overdue</option>
          </select>
          <select id="filter-priority" class="border border-slate-300 rounded-lg px-2 py-2 text-xs">
            <option value="">All Priority</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
          <select id="filter-subject" class="border border-slate-300 rounded-lg px-2 py-2 text-xs">
            <option value="">All Subjects</option>
          </select>
        </div>
      </div>

      <div id="task-list" class="space-y-3"></div>

      <div id="empty-state" class="hidden text-center py-16">
        <div class="text-4xl mb-2">🗒️</div>
        <p class="font-medium text-slate-600">No matching tasks</p>
        <p class="text-sm text-slate-400">Try adjusting your search or filters</p>
      </div>
    </section>

    <!-- ADD / EDIT TASK VIEW -->
    <section id="view-add" class="view hidden">
      <h2 id="form-title" class="text-xl font-semibold mb-4">Add Task</h2>
      <form id="task-form" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-4" novalidate>
        <input type="hidden" id="task-id" />

        <div>
          <label class="block text-sm font-medium mb-1">Task Title *</label>
          <input id="f-title" type="text" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          <p class="error-msg text-rose-500 text-xs mt-1 hidden" data-for="f-title">Title is required.</p>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Description</label>
          <textarea id="f-description" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Course / Subject *</label>
          <input id="f-subject" type="text" placeholder="e.g. Mathematics" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          <p class="error-msg text-rose-500 text-xs mt-1 hidden" data-for="f-subject">Course/Subject is required.</p>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Priority *</label>
            <select id="f-priority" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Due Date *</label>
            <input id="f-due" type="date" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
            <p class="error-msg text-rose-500 text-xs mt-1 hidden" data-for="f-due">Due date is required.</p>
          </div>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="submit" class="flex-1 bg-indigo-600 text-white font-medium py-2.5 rounded-lg hover:bg-indigo-700">
            Save Task
          </button>
          <button type="button" id="cancel-form-btn" class="px-4 py-2.5 rounded-lg border border-slate-300 text-slate-600">
            Cancel
          </button>
        </div>
      </form>
    </section>

  </main>

  <!-- Task Details Modal -->
  <div id="details-modal" class="hidden fixed inset-0 bg-black/40 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-md max-h-[85vh] overflow-y-auto p-5 relative">
      <button id="close-details" class="absolute top-3 right-4 text-slate-400 text-xl">&times;</button>
      <div id="details-content"></div>
    </div>
  </div>

  <!-- Bottom nav (mobile-first) -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-30">
    <div class="max-w-5xl mx-auto grid grid-cols-3">
      <button data-view="dashboard" class="nav-btn py-3 text-xs font-medium flex flex-col items-center gap-1">
        <span class="text-lg">🏠</span> Dashboard
      </button>
      <button data-view="tasks" class="nav-btn py-3 text-xs font-medium flex flex-col items-center gap-1">
        <span class="text-lg">📋</span> Tasks
      </button>
      <button data-view="add" class="nav-btn py-3 text-xs font-medium flex flex-col items-center gap-1">
        <span class="text-lg">➕</span> Add Task
      </button>
    </div>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
